<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 墨黑底 -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="#16181D"/>
  <!-- 斜执的笔（米白） -->
  <g transform="translate(490,490) rotate(-45)">
    <!-- 笔身 -->
    <rect x="-270" y="-42" width="470" height="84" rx="42" fill="#F5F1E8"/>
    <!-- 笔尖 -->
    <polygon points="200,-42 360,0 200,42" fill="#F5F1E8"/>
    <!-- 笔尖朱砂墨点 -->
    <circle cx="228" cy="0" r="9" fill="#C3272B"/>
  </g>
  <!-- 朱砂印章（右下） -->
  <rect x="668" y="668" width="240" height="240" rx="44" fill="#C3272B"/>
  <rect x="724" y="724" width="128" height="128" rx="14" fill="none" stroke="#F5F1E8" stroke-width="26"/>
  <rect x="764" y="764" width="48" height="48" rx="8" fill="#F5F1E8"/>
</svg>
